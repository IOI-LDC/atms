; ===========================================================================
; DEV ONLY — mounted via compose.override.yaml over the production zz-atms.ini.
;
; Re-enables per-request file stat-ing so backend changes are picked up
; immediately during development without restarting the api container.
; The file loads AFTER zz-atms.ini (sorted alphabetically: zz- < zzz-) so
; these values win in dev.
;
; DO NOT mount this file in production — see docker/backend/php/zz-atms.ini.
; ===========================================================================

; Re-check file timestamps on every request for hot reload during dev.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; --- Uploads ---
; Duplicated from zz-atms.ini deliberately. That file is baked into the image,
; so editing it needs a rebuild; this one is bind-mounted, so a container
; restart is enough locally. Keep the two in sync — see the rationale in
; zz-atms.ini: PHP's stock 2M cap silently rejected every attachment over 2 MB
; with a misleading "The file field is required" validation error.
upload_max_filesize = 20M
post_max_size = 25M
